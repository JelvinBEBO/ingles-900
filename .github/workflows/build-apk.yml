name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependencias y Sincronizar Capacitor
        run: |
          # 1. Asegurar package.json e instalar Capacitor CLI y Android
          if [ ! -f "package.json" ]; then npm init -y; fi
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          # 2. Si no existe capacitor.config.json, crearlo
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Ingles900" "com.educacion.ingles900" --web-dir "src"
          fi

          # 3. Si no existe la carpeta android, agregarla
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # 4. SYNC genera obligatoriamente 'capacitor.settings.gradle'
          npx cap sync android

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Publicar Archivo APK Descargable
        uses: actions/upload-artifact@v4
        with:
          name: app-ingles900-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
